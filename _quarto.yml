format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    code-tools: true
    code-copy: true
    fig-align: center
    smooth-scroll: true

execute:
  echo: true
  warning: false
  message: false
  freeze: auto

jupyter: python3

